<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">Logo</div>
      <nav class="nav">
        <a href="#inicio" class="nav-link">Inicio</a>
        <a href="#features" class="nav-link">Características</a>
        <a href="#contacto" class="nav-link">Contacto</a>
      </nav>
    </div>
  </header>

  <section id="inicio" class="hero">
    <div class="container">
      <h1 class="hero-title">Bienvenido a tu landing page</h1>
      <p class="hero-text">Una solución simple y elegante para tu negocio</p>
      <button class="btn">Comenzar ahora</button>
    </div>
  </section>

  <section id="features" class="features">
    <div class="container">
      <h2 class="section-title">Características</h2>
      <div class="features-grid">
        <div class="feature-card">
          <h3 class="feature-title">Rápido</h3>
          <p class="feature-text">Optimizado para el mejor rendimiento</p>
        </div>
        <div class="feature-card">
          <h3 class="feature-title">Simple</h3>
          <p class="feature-text">Fácil de usar y entender</p>
        </div>
        <div class="feature-card">
          <h3 class="feature-title">Moderno</h3>
          <p class="feature-text">Diseño actual y limpio</p>
        </div>
      </div>
    </div>
  </section>

  <footer id="contacto" class="footer">
    <div class="container">
      <p class="footer-text">© 2026 Tu Empresa</p>
      <p class="footer-subtext">Todos los derechos reservados</p>
    </div>
  </footer>
</body>
</html>
